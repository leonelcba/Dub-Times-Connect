name: Compilar APK Android 1.0.1
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar SDK Android
        uses: android-actions/setup-android@v4
      - name: Instalar API Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar versión Android
        run: |
          grep -q 'com.dubtimes.connectviewer' app/build.gradle
          grep -q 'versionCode 1001' app/build.gradle
          test -f app/src/main/java/com/dubtimes/connectviewer/MainActivity.java
      - name: Compilar APK debug
        run: gradle :app:assembleDebug --no-daemon
      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: DubTimesConnect-Android-1.0.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Verificar firma para actualización
        id: signing
        env:
          SIGNING_KEYSTORE: ${{ secrets.DUBTIMES_ANDROID_KEYSTORE_B64 }}
          SIGNING_STORE_PASS: ${{ secrets.DUBTIMES_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.DUBTIMES_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.DUBTIMES_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ] && [ -n "$SIGNING_STORE_PASS" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASS" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'No hay firma privada: se entrega solo APK debug.'
          fi
      - name: Preparar firma privada
        if: steps.signing.outputs.ready == 'true'
        env:
          SIGNING_KEYSTORE: ${{ secrets.DUBTIMES_ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p Firma
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > Firma/connect-key.jks
      - name: Compilar APK release firmado
        if: steps.signing.outputs.ready == 'true'
        env:
          DUBTIMES_SIGN_RELEASE: 'true'
          DUBTIMES_KEYSTORE_PASSWORD: ${{ secrets.DUBTIMES_KEYSTORE_PASSWORD }}
          DUBTIMES_KEY_ALIAS: ${{ secrets.DUBTIMES_KEY_ALIAS }}
          DUBTIMES_KEY_PASSWORD: ${{ secrets.DUBTIMES_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Publicar APK release firmado
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DubTimesConnect-Android-1.0.1-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
